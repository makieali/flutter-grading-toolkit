name: rubric_builder
description: >-
  A Flutter widget for authoring weighted grading rubrics, with a live points
  total and a clean, serializable, controller-free data model.
version: 0.1.0
repository: https://github.com/makieali/flutter-grading-toolkit
issue_tracker: https://github.com/makieali/flutter-grading-toolkit/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
