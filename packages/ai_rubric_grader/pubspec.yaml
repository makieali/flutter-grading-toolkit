name: ai_rubric_grader
description: >-
  LLM-agnostic, rubric-based automatic grading for Dart. Feed it questions,
  rubrics and student answers; get back structured, clamped scores with
  per-rubric rationale. Bring your own LLM client.
version: 0.1.0
repository: https://github.com/makieali/flutter-grading-toolkit
issue_tracker: https://github.com/makieali/flutter-grading-toolkit/issues

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  meta: ^1.9.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
